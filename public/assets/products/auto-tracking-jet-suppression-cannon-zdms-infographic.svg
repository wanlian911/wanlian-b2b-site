<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="60" font-size="30" font-weight="bold" fill="#1c1e21">How the ZDMS Puts Out a Fire With Nobody on Shift</text>
  <text x="48" y="92" font-size="15" fill="#6e7278">IR + UV detection · 360° tracking · Concentrated jet</text>

  <!-- Panel backgrounds -->
  <rect x="48" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="432" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="816" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>

  <!-- Arrows between panels -->
  <polygon points="390,322 390,346 426,334" fill="#9aa0a6"/>
  <polygon points="774,322 774,346 810,334" fill="#9aa0a6"/>

  <!-- ================= Panel 1: DETECT ================= -->
  <text x="72" y="176" font-size="44" font-weight="bold" fill="#c82024">01</text>
  <text x="72" y="206" font-size="19" font-weight="bold" fill="#1c1e21">DETECT</text>

  <!-- sensor box -->
  <rect x="96" y="298" width="66" height="46" rx="9" fill="#3a3f45"/>
  <circle cx="152" cy="321" r="11" fill="#c82024"/>
  <circle cx="152" cy="321" r="4.5" fill="#ffffff"/>

  <!-- dashed rays to flame -->
  <line x1="168" y1="310" x2="252" y2="272" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="170" y1="322" x2="256" y2="292" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="168" y1="334" x2="252" y2="312" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- flame -->
  <path d="M285,240 C285,240 258,278 258,300 a27,27 0 0 0 54,0 C312,278 285,240 285,240 Z" fill="#c82024"/>
  <path d="M285,268 C285,268 272,288 272,299 a13,13 0 0 0 26,0 C298,288 285,268 285,268 Z" fill="#f08c1a"/>

  <!-- range arc -->
  <path d="M110,392 a110,38 0 0 1 212,0" fill="none" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="216" y="412" font-size="14" fill="#4a4f55" text-anchor="middle">40-65 m</text>

  <!-- Panel 1 captions -->
  <text x="72" y="452" font-size="13.5" fill="#4a4f55">Multi-band infrared and ultraviolet</text>
  <text x="72" y="472" font-size="13.5" fill="#4a4f55">sensors find the flame from 40-65 m</text>
  <text x="72" y="492" font-size="13.5" fill="#4a4f55">away, without an operator.</text>

  <!-- ================= Panel 2: TRACK ================= -->
  <text x="456" y="176" font-size="44" font-weight="bold" fill="#c82024">02</text>
  <text x="456" y="206" font-size="19" font-weight="bold" fill="#1c1e21">TRACK</text>

  <!-- rotation arc -->
  <circle cx="600" cy="330" r="72" fill="none" stroke="#9aa0a6" stroke-width="3" stroke-dasharray="7 6"/>
  <polygon points="672,330 654,320 654,340" fill="#9aa0a6"/>

  <!-- pivot + barrel toward the flame -->
  <circle cx="600" cy="330" r="10" fill="#1c1e21"/>
  <polygon points="592,336 668,272 682,286 606,344" fill="#1c1e21"/>
  <polygon points="668,272 682,286 694,274 680,260" fill="#3a3f45"/>

  <!-- flame being tracked, with brackets -->
  <path d="M712,218 C712,218 692,244 692,260 a20,20 0 0 0 40,0 C732,244 712,218 712,218 Z" fill="#c82024"/>
  <path d="M712,238 C712,238 703,252 703,260 a9,9 0 0 0 18,0 C721,252 712,238 712,238 Z" fill="#f08c1a"/>
  <polyline points="684,214 684,204 694,204" fill="none" stroke="#1c1e21" stroke-width="3"/>
  <polyline points="740,214 740,204 730,204" fill="none" stroke="#1c1e21" stroke-width="3"/>
  <polyline points="684,278 684,288 694,288" fill="none" stroke="#1c1e21" stroke-width="3"/>
  <polyline points="740,278 740,288 730,288" fill="none" stroke="#1c1e21" stroke-width="3"/>

  <!-- drift arrow -->
  <path d="M660,238 a52,52 0 0 1 34,18" fill="none" stroke="#c82024" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="694,256 682,254 690,244" fill="#c82024"/>

  <!-- Panel 2 captions -->
  <text x="456" y="452" font-size="13.5" fill="#4a4f55">The cannon locks on and follows the</text>
  <text x="456" y="472" font-size="13.5" fill="#4a4f55">fire as it moves: 360° horizontal,</text>
  <text x="456" y="492" font-size="13.5" fill="#4a4f55">-90° to +30° vertical.</text>

  <!-- ================= Panel 3: EXTINGUISH ================= -->
  <text x="840" y="176" font-size="44" font-weight="bold" fill="#c82024">03</text>
  <text x="840" y="206" font-size="19" font-weight="bold" fill="#1c1e21">EXTINGUISH</text>

  <!-- nozzle -->
  <polygon points="876,282 924,294 924,322 876,334" fill="#1c1e21"/>
  <rect x="856" y="286" width="22" height="44" rx="5" fill="#3a3f45"/>

  <!-- water jet -->
  <line x1="930" y1="296" x2="1004" y2="280" stroke="#2563a8" stroke-width="6" stroke-linecap="round"/>
  <line x1="930" y1="308" x2="1008" y2="300" stroke="#2563a8" stroke-width="5" stroke-linecap="round"/>
  <line x1="930" y1="320" x2="1004" y2="320" stroke="#2563a8" stroke-width="5" stroke-linecap="round"/>

  <!-- knocked-down flame + steam -->
  <path d="M1030,296 C1030,296 1016,314 1016,324 a14,14 0 0 0 28,0 C1044,314 1030,296 1030,296 Z" fill="#c82024" opacity="0.55"/>
  <circle cx="1022" cy="280" r="9" fill="#c9cdd2"/>
  <circle cx="1038" cy="268" r="11" fill="#d8dbde"/>
  <circle cx="1052" cy="282" r="8" fill="#c9cdd2"/>

  <!-- check -->
  <circle cx="1030" cy="384" r="20" fill="#1c1e21"/>
  <polyline points="1020,384 1028,392 1042,374" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Panel 3 captions -->
  <text x="840" y="452" font-size="13.5" fill="#4a4f55">A concentrated jet knocks the fire</text>
  <text x="840" y="472" font-size="13.5" fill="#4a4f55">down. Override from PC, APP or</text>
  <text x="840" y="492" font-size="13.5" fill="#4a4f55">central cabinet whenever needed.</text>

  <!-- Spec chips -->
  <g font-size="14" fill="#1c1e21">
    <rect x="48" y="580" width="298" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="197" y="603" text-anchor="middle">5-30 L/s rated (to 150 L/s custom)</text>

    <rect x="362" y="580" width="120" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="422" y="603" text-anchor="middle">0.6-0.8 MPa</text>

    <rect x="498" y="580" width="224" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="610" y="603" text-anchor="middle">40-65 m monitoring radius</text>

    <rect x="738" y="580" width="214" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="845" y="603" text-anchor="middle">Exde II BT4 Gb (optional)</text>
  </g>

  <text x="48" y="662" font-size="12" fill="#9aa0a6">Schematic, not to scale. All facts per the ZDMS specification sheet.</text>
</svg>
