<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="60" font-size="30" font-weight="bold" fill="#1c1e21">How the SSFT100/65 Survives a Truck Hit</text>
  <text x="48" y="92" font-size="15" fill="#6e7278">Bolt-shear shutdown · Self-closing on impact · Pressurized repair</text>

  <!-- Panel backgrounds -->
  <rect x="48" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="432" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="816" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>

  <!-- Arrows between panels -->
  <polygon points="390,322 390,346 426,334" fill="#9aa0a6"/>
  <polygon points="774,322 774,346 810,334" fill="#9aa0a6"/>

  <!-- ================= Panel 1: THE IMPACT ================= -->
  <text x="72" y="176" font-size="44" font-weight="bold" fill="#c82024">01</text>
  <text x="72" y="206" font-size="19" font-weight="bold" fill="#1c1e21">THE IMPACT</text>

  <!-- ground -->
  <line x1="76" y1="372" x2="356" y2="372" stroke="#d5d8dc" stroke-width="3"/>

  <!-- motion lines -->
  <line x1="66" y1="296" x2="86" y2="296" stroke="#c82024" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="316" x2="86" y2="316" stroke="#c82024" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="336" x2="86" y2="336" stroke="#c82024" stroke-width="4" stroke-linecap="round"/>

  <!-- truck -->
  <rect x="92" y="286" width="108" height="66" rx="4" fill="#3a3f45"/>
  <rect x="200" y="304" width="36" height="48" rx="6" fill="#3a3f45"/>
  <rect x="206" y="310" width="22" height="18" rx="3" fill="#f5f6f8"/>
  <circle cx="120" cy="358" r="13" fill="#1c1e21"/>
  <circle cx="178" cy="358" r="13" fill="#1c1e21"/>
  <circle cx="216" cy="358" r="13" fill="#1c1e21"/>

  <!-- impact flash -->
  <polygon points="258,318 272,304 266,318 282,312 268,326 284,330 264,334 270,348 254,332 246,344 250,326 238,322" fill="#c82024"/>

  <!-- hydrant silhouette -->
  <rect x="296" y="240" width="22" height="18" rx="3" fill="#c82024"/>
  <ellipse cx="307" cy="270" rx="36" ry="22" fill="#c82024"/>
  <rect x="285" y="272" width="44" height="126" rx="9" fill="#c82024"/>
  <rect x="259" y="292" width="26" height="17" rx="4" fill="#a5181c"/>
  <rect x="327" y="292" width="26" height="17" rx="4" fill="#a5181c"/>
  <circle cx="307" cy="322" r="23" fill="#a5181c"/>
  <circle cx="307" cy="322" r="10" fill="#c82024"/>
  <rect x="268" y="398" width="78" height="15" rx="5" fill="#1c1e21"/>

  <!-- Panel 1 captions -->
  <text x="72" y="452" font-size="13.5" fill="#4a4f55">A truck strike hits the standpipe.</text>
  <text x="72" y="472" font-size="13.5" fill="#4a4f55">The calibrated shear bolts (medium</text>
  <text x="72" y="492" font-size="13.5" fill="#4a4f55">carbon steel, zinc plated) shear cleanly.</text>

  <!-- ================= Panel 2: AUTO-SHUTDOWN ================= -->
  <text x="456" y="176" font-size="44" font-weight="bold" fill="#c82024">02</text>
  <text x="456" y="206" font-size="19" font-weight="bold" fill="#1c1e21">AUTO-SHUTDOWN</text>

  <!-- sheared hex bolt -->
  <polygon points="600,252 640,275 640,321 600,344 560,321 560,275" fill="#3a3f45"/>
  <path d="M600,252 L592,278 L604,300 L590,326 L600,344" fill="none" stroke="#ffffff" stroke-width="7"/>
  <polygon points="604,300 616,292 612,306" fill="#c82024"/>
  <polygon points="592,278 580,272 586,286" fill="#c82024"/>

  <!-- stem drop arrow -->
  <line x1="676" y1="268" x2="676" y2="316" stroke="#1c1e21" stroke-width="6"/>
  <polygon points="666,312 686,312 676,330" fill="#1c1e21"/>
  <rect x="654" y="330" width="44" height="12" rx="4" fill="#c82024"/>

  <!-- droplet with slash -->
  <path d="M560,352 C560,352 542,378 542,390 a18,18 0 0 0 36,0 C578,378 560,352 560,352 Z" fill="#2563a8"/>
  <line x1="534" y1="408" x2="586" y2="350" stroke="#c82024" stroke-width="6" stroke-linecap="round"/>

  <!-- Panel 2 captions -->
  <text x="456" y="452" font-size="13.5" fill="#4a4f55">The bolt shears, the stem drops and</text>
  <text x="456" y="472" font-size="13.5" fill="#4a4f55">the internal valve shuts the water off.</text>
  <text x="456" y="492" font-size="13.5" fill="#4a4f55">Outlet stays dry. Line keeps pressure.</text>

  <!-- ================= Panel 3: REPAIR UNDER PRESSURE ================= -->
  <text x="840" y="176" font-size="44" font-weight="bold" fill="#c82024">03</text>
  <text x="840" y="206" font-size="19" font-weight="bold" fill="#1c1e21">REPAIR UNDER PRESSURE</text>

  <!-- old bolt with X -->
  <polygon points="900,252 940,275 940,321 900,344 860,321 860,275" fill="#9aa0a6"/>
  <line x1="880" y1="272" x2="920" y2="324" stroke="#c82024" stroke-width="7" stroke-linecap="round"/>
  <line x1="920" y1="272" x2="880" y2="324" stroke="#c82024" stroke-width="7" stroke-linecap="round"/>

  <!-- swap arrow -->
  <line x1="952" y1="298" x2="1004" y2="298" stroke="#1c1e21" stroke-width="6"/>
  <polygon points="1000,288 1000,308 1018,298" fill="#1c1e21"/>

  <!-- new bolt with check -->
  <polygon points="1044,252 1084,275 1084,321 1044,344 1004,321 1004,275" fill="#1c1e21"/>
  <polyline points="1026,296 1040,310 1064,282" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pressure gauge -->
  <path d="M950,392 a34,34 0 0 1 68,0" fill="none" stroke="#3a3f45" stroke-width="7"/>
  <line x1="984" y1="392" x2="1004" y2="370" stroke="#c82024" stroke-width="5" stroke-linecap="round"/>
  <circle cx="984" cy="392" r="6" fill="#1c1e21"/>
  <text x="984" y="428" font-size="13" fill="#4a4f55" text-anchor="middle">Pressure held</text>

  <!-- Panel 3 captions -->
  <text x="840" y="452" font-size="13.5" fill="#4a4f55">Pull two sheared bolts, fit two new</text>
  <text x="840" y="472" font-size="13.5" fill="#4a4f55">ones, restart. No draining the main,</text>
  <text x="840" y="492" font-size="13.5" fill="#4a4f55">no digging up a flanged valve.</text>

  <!-- Spec chips -->
  <g font-size="14" fill="#1c1e21">
    <rect x="48" y="580" width="150" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="123" y="603" text-anchor="middle">DN100 / DN150</text>

    <rect x="214" y="580" width="132" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="280" y="603" text-anchor="middle">PN16 · 1.6 MPa</text>

    <rect x="362" y="580" width="176" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="450" y="603" text-anchor="middle">QT450 ductile iron</text>

    <rect x="554" y="580" width="226" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="667" y="603" text-anchor="middle">2×KWS65 + 1×DN100</text>

    <rect x="796" y="580" width="268" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="930" y="603" text-anchor="middle">Hydrostatic tested 2.4 MPa (GB 4452)</text>
  </g>

  <text x="48" y="662" font-size="12" fill="#9aa0a6">Schematic, not to scale. All facts per the SSFT100/65 specification sheet.</text>
</svg>
