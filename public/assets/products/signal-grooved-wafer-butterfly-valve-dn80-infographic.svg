<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="48" y="60" font-size="30" font-weight="bold" fill="#1c1e21">How a Valve You Can't See Fails You</text>
  <text x="48" y="92" font-size="15" fill="#6e7278">Position reported · Quarter-turn · Bi-directional sealing</text>

  <rect x="48" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="432" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="816" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>

  <polygon points="390,322 390,346 426,334" fill="#9aa0a6"/>
  <polygon points="774,322 774,346 810,334" fill="#9aa0a6"/>

  <!-- Panel 1: BLIND -->
  <text x="72" y="176" font-size="44" font-weight="bold" fill="#c82024">01</text>
  <text x="72" y="206" font-size="19" font-weight="bold" fill="#1c1e21">BLIND</text>

  <!-- control panel with alarm lamp -->
  <rect x="110" y="240" width="120" height="80" rx="8" fill="#3a3f45"/>
  <circle cx="145" cy="272" r="12" fill="#c82024"/>
  <circle cx="145" cy="272" r="5" fill="#ffd7d8"/>
  <rect x="170" y="262" width="44" height="8" rx="3" fill="#6e7278"/>
  <rect x="170" y="278" width="44" height="8" rx="3" fill="#6e7278"/>
  <rect x="170" y="294" width="30" height="8" rx="3" fill="#9aa0a6"/>
  <!-- pipe line -->
  <line x1="90" y1="380" x2="345" y2="380" stroke="#c82024" stroke-width="10" stroke-dasharray="26 12"/>
  <!-- walking operator -->
  <circle cx="285" cy="316" r="11" fill="#1c1e21"/>
  <line x1="285" y1="327" x2="285" y2="356" stroke="#1c1e21" stroke-width="6"/>
  <line x1="285" y1="356" x2="270" y2="380" stroke="#1c1e21" stroke-width="5"/>
  <line x1="285" y1="356" x2="300" y2="378" stroke="#1c1e21" stroke-width="5"/>
  <line x1="285" y1="336" x2="302" y2="348" stroke="#1c1e21" stroke-width="5"/>

  <text x="72" y="452" font-size="13.5" fill="#4a4f55">The control room thinks it's open.</text>
  <text x="72" y="472" font-size="13.5" fill="#4a4f55">It's closed. Nobody walks 500 m</text>
  <text x="72" y="492" font-size="13.5" fill="#4a4f55">down the line to check.</text>

  <!-- Panel 2: QUARTER-TURN -->
  <text x="456" y="176" font-size="44" font-weight="bold" fill="#c82024">02</text>
  <text x="456" y="206" font-size="19" font-weight="bold" fill="#1c1e21">QUARTER-TURN</text>

  <!-- pipe cross-section with disc -->
  <circle cx="600" cy="310" r="86" fill="none" stroke="#c82024" stroke-width="10"/>
  <circle cx="600" cy="310" r="72" fill="#f5f6f8" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="530" y="300" width="140" height="20" rx="8" fill="#1c1e21" transform="rotate(45 600 310)"/>
  <!-- 90 degree arc arrow -->
  <path d="M600,206 a104,104 0 0 1 104,104" fill="none" stroke="#c82024" stroke-width="5"/>
  <polygon points="704,310 704,290 718,304" fill="#c82024"/>
  <text x="600" y="440" font-size="13" fill="#4a4f55" text-anchor="middle">one quarter turn, low torque</text>

  <text x="456" y="452" font-size="13.5" fill="#4a4f55">One quarter turn of the worm gear</text>
  <text x="456" y="472" font-size="13.5" fill="#4a4f55">handwheel. Bi-directional sealing,</text>
  <text x="456" y="492" font-size="13.5" fill="#4a4f55">EPDM or NBR seat.</text>

  <!-- Panel 3: STATUS ON PANEL -->
  <text x="840" y="176" font-size="44" font-weight="bold" fill="#c82024">03</text>
  <text x="840" y="206" font-size="19" font-weight="bold" fill="#1c1e21">STATUS ON PANEL</text>

  <!-- control panel with green lamp -->
  <rect x="880" y="240" width="120" height="80" rx="8" fill="#3a3f45"/>
  <circle cx="915" cy="272" r="12" fill="#2e9e44"/>
  <circle cx="915" cy="272" r="5" fill="#d3f5d9"/>
  <rect x="940" y="262" width="44" height="8" rx="3" fill="#6e7278"/>
  <rect x="940" y="278" width="44" height="8" rx="3" fill="#6e7278"/>
  <rect x="940" y="294" width="30" height="8" rx="3" fill="#9aa0a6"/>
  <!-- open pipe -->
  <line x1="860" y1="380" x2="1115" y2="380" stroke="#c82024" stroke-width="10"/>
  <line x1="900" y1="380" x2="1080" y2="380" stroke="#2563a8" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- operator at panel -->
  <circle cx="1050" cy="316" r="11" fill="#1c1e21"/>
  <line x1="1050" y1="327" x2="1050" y2="356" stroke="#1c1e21" stroke-width="6"/>
  <line x1="1050" y1="356" x2="1040" y2="380" stroke="#1c1e21" stroke-width="5"/>
  <line x1="1050" y1="356" x2="1060" y2="380" stroke="#1c1e21" stroke-width="5"/>

  <text x="840" y="452" font-size="13.5" fill="#4a4f55">The waterproof microswitch flips</text>
  <text x="840" y="472" font-size="13.5" fill="#4a4f55">open or closed to the panel.</text>
  <text x="840" y="492" font-size="13.5" fill="#4a4f55">No walking the line.</text>

  <g font-size="14" fill="#1c1e21">
    <rect x="48" y="580" width="140" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="118" y="603" text-anchor="middle">DN50 - DN300</text>

    <rect x="204" y="580" width="100" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="254" y="603" text-anchor="middle">PN16</text>

    <rect x="320" y="580" width="176" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="408" y="603" text-anchor="middle">QT450 ductile iron</text>

    <rect x="512" y="580" width="150" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="587" y="603" text-anchor="middle">EPDM / NBR seat</text>

    <rect x="678" y="580" width="248" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="802" y="603" text-anchor="middle">100% tested (GB/T 13927)</text>
  </g>

  <text x="48" y="662" font-size="12" fill="#9aa0a6">Schematic, not to scale. All facts per the signal butterfly valve specification sheet.</text>
</svg>
