<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="48" y="60" font-size="30" font-weight="bold" fill="#1c1e21">Aim Once. Lock It. Walk Away.</text>
  <text x="48" y="92" font-size="15" fill="#6e7278">20-200 L/s · 50-110 m · Self-locking gear</text>

  <rect x="48" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="432" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="816" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>

  <polygon points="390,322 390,346 426,334" fill="#9aa0a6"/>
  <polygon points="774,322 774,346 810,334" fill="#9aa0a6"/>

  <!-- Panel 1: HOLDING -->
  <text x="72" y="176" font-size="44" font-weight="bold" fill="#c82024">01</text>
  <text x="72" y="206" font-size="19" font-weight="bold" fill="#1c1e21">HOLDING</text>

  <!-- straining operator -->
  <circle cx="150" cy="270" r="14" fill="#1c1e21"/>
  <line x1="150" y1="284" x2="158" y2="330" stroke="#1c1e21" stroke-width="7"/>
  <line x1="152" y1="296" x2="190" y2="308" stroke="#1c1e21" stroke-width="6"/>
  <line x1="156" y1="330" x2="138" y2="372" stroke="#1c1e21" stroke-width="6"/>
  <line x1="156" y1="330" x2="172" y2="372" stroke="#1c1e21" stroke-width="6"/>
  <!-- hose with recoil wobble -->
  <path d="M190,308 C230,296 250,330 288,314 C320,300 336,330 368,316" fill="none" stroke="#3a3f45" stroke-width="10"/>
  <!-- spray -->
  <line x1="368" y1="316" x2="398" y2="300" stroke="#2563a8" stroke-width="5" stroke-linecap="round"/>
  <line x1="368" y1="316" x2="402" y2="316" stroke="#2563a8" stroke-width="5" stroke-linecap="round"/>
  <line x1="368" y1="316" x2="398" y2="332" stroke="#2563a8" stroke-width="5" stroke-linecap="round"/>
  <!-- recoil marks -->
  <line x1="204" y1="296" x2="214" y2="288" stroke="#c82024" stroke-width="4"/>
  <line x1="208" y1="312" x2="220" y2="310" stroke="#c82024" stroke-width="4"/>

  <text x="72" y="452" font-size="13.5" fill="#4a4f55">A person holds the line against</text>
  <text x="72" y="472" font-size="13.5" fill="#4a4f55">the recoil, hour after hour, inside</text>
  <text x="72" y="492" font-size="13.5" fill="#4a4f55">the heat of the fire.</text>

  <!-- Panel 2: AIM & LOCK -->
  <text x="456" y="176" font-size="44" font-weight="bold" fill="#c82024">02</text>
  <text x="456" y="206" font-size="19" font-weight="bold" fill="#1c1e21">AIM &amp; LOCK</text>

  <!-- monitor silhouette -->
  <rect x="586" y="330" width="28" height="60" fill="#c82024"/>
  <polygon points="574,300 660,268 668,286 582,318" fill="#c82024"/>
  <line x1="600" y1="330" x2="600" y2="392" stroke="#9aa0a6" stroke-width="5" stroke-dasharray="7 6"/>
  <!-- rotation arc -->
  <path d="M520,300 a92,92 0 0 1 130,-64" fill="none" stroke="#9aa0a6" stroke-width="4" stroke-dasharray="7 6"/>
  <polygon points="650,236 664,248 642,250" fill="#9aa0a6"/>
  <!-- padlock on the gear -->
  <rect x="588" y="352" width="24" height="20" rx="4" fill="#1c1e21"/>
  <path d="M592,352 v-8 a8,8 0 0 1 16,0 v8" fill="none" stroke="#1c1e21" stroke-width="5"/>

  <text x="456" y="452" font-size="13.5" fill="#4a4f55">The hand lever aims, one pull</text>
  <text x="456" y="472" font-size="13.5" fill="#4a4f55">changes straight jet to fog, and</text>
  <text x="456" y="492" font-size="13.5" fill="#4a4f55">the self-locking gear holds it.</text>

  <!-- Panel 3: UNMANNED -->
  <text x="840" y="176" font-size="44" font-weight="bold" fill="#c82024">03</text>
  <text x="840" y="206" font-size="19" font-weight="bold" fill="#1c1e21">UNMANNED SPRAY</text>

  <!-- monitor spraying -->
  <rect x="856" y="300" width="26" height="56" fill="#c82024"/>
  <polygon points="846,272 926,240 934,258 854,290" fill="#c82024"/>
  <!-- jet on target -->
  <line x1="930" y1="250" x2="1030" y2="216" stroke="#2563a8" stroke-width="6" stroke-linecap="round"/>
  <line x1="930" y1="252" x2="1034" y2="230" stroke="#2563a8" stroke-width="4" stroke-linecap="round"/>
  <!-- target -->
  <rect x="1030" y="196" width="18" height="56" rx="4" fill="#3a3f45"/>
  <!-- walking-away operator -->
  <circle cx="1080" cy="330" r="11" fill="#1c1e21"/>
  <line x1="1080" y1="341" x2="1088" y2="372" stroke="#1c1e21" stroke-width="6"/>
  <line x1="1086" y1="372" x2="1072" y2="398" stroke="#1c1e21" stroke-width="5"/>
  <line x1="1088" y1="372" x2="1102" y2="392" stroke="#1c1e21" stroke-width="5"/>
  <line x1="1080" y1="350" x2="1098" y2="360" stroke="#1c1e21" stroke-width="5"/>
  <line x1="1056" y1="340" x2="1044" y2="336" stroke="#9aa0a6" stroke-width="4"/>
  <line x1="1056" y1="352" x2="1042" y2="352" stroke="#9aa0a6" stroke-width="4"/>

  <text x="840" y="452" font-size="13.5" fill="#4a4f55">20-200 L/s up to 110 m, unmanned.</text>
  <text x="840" y="472" font-size="13.5" fill="#4a4f55">The operator gets out of the zone.</text>
  <text x="840" y="492" font-size="13.5" fill="#4a4f55">The jet stays on target.</text>

  <g font-size="14" fill="#1c1e21">
    <rect x="48" y="580" width="130" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="113" y="603" text-anchor="middle">20-200 L/s</text>

    <rect x="194" y="580" width="150" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="269" y="603" text-anchor="middle">50-110 m reach</text>

    <rect x="360" y="580" width="130" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="425" y="603" text-anchor="middle">0.8-1.2 MPa</text>

    <rect x="506" y="580" width="184" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="598" y="603" text-anchor="middle">360° · -30° to +70°</text>

    <rect x="706" y="580" width="196" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="804" y="603" text-anchor="middle">T6 aluminum / bronze</text>
  </g>

  <text x="48" y="662" font-size="12" fill="#9aa0a6">Schematic, not to scale. All facts per the PS series monitor specification sheet.</text>
</svg>
