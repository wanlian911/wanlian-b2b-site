<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="48" y="60" font-size="30" font-weight="bold" fill="#1c1e21">Why Firefighters Switch to Storz</text>
  <text x="48" y="92" font-size="15" fill="#6e7278">Quarter-turn lock · Self-sealing gasket · 1.6 MPa</text>

  <rect x="48" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="432" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>
  <rect x="816" y="120" width="336" height="428" rx="14" fill="#f5f6f8"/>

  <polygon points="390,322 390,346 426,334" fill="#9aa0a6"/>
  <polygon points="774,322 774,346 810,334" fill="#9aa0a6"/>

  <!-- Panel 1: SLOW -->
  <text x="72" y="176" font-size="44" font-weight="bold" fill="#c82024">01</text>
  <text x="72" y="206" font-size="19" font-weight="bold" fill="#1c1e21">SLOW</text>

  <!-- threaded coupling -->
  <rect x="100" y="290" width="70" height="44" rx="6" fill="#9aa0a6"/>
  <rect x="170" y="290" width="70" height="44" rx="6" fill="#9aa0a6"/>
  <line x1="172" y1="292" x2="172" y2="332" stroke="#3a3f45" stroke-width="3"/>
  <!-- wrench -->
  <line x1="200" y1="270" x2="252" y2="222" stroke="#3a3f45" stroke-width="9" stroke-linecap="round"/>
  <circle cx="258" cy="216" r="12" fill="none" stroke="#3a3f45" stroke-width="6"/>
  <!-- drips -->
  <path d="M140,346 C140,346 133,356 133,361 a7,7 0 0 0 14,0 C147,356 140,346 140,346 Z" fill="#2563a8"/>
  <path d="M180,352 C180,352 173,362 173,367 a7,7 0 0 0 14,0 C187,362 180,352 180,352 Z" fill="#2563a8"/>
  <path d="M222,348 C222,348 215,358 215,363 a7,7 0 0 0 14,0 C229,358 222,348 222,348 Z" fill="#2563a8"/>

  <text x="72" y="452" font-size="13.5" fill="#4a4f55">Threaded joints take two people</text>
  <text x="72" y="472" font-size="13.5" fill="#4a4f55">and a wrench, and they drip</text>
  <text x="72" y="492" font-size="13.5" fill="#4a4f55">at the seal under pressure.</text>

  <!-- Panel 2: QUARTER-TURN -->
  <text x="456" y="176" font-size="44" font-weight="bold" fill="#c82024">02</text>
  <text x="456" y="206" font-size="19" font-weight="bold" fill="#1c1e21">QUARTER-TURN</text>

  <!-- two Storz halves meeting -->
  <rect x="480" y="284" width="92" height="56" rx="8" fill="#9aa0a6"/>
  <rect x="580" y="284" width="92" height="56" rx="8" fill="#9aa0a6"/>
  <rect x="574" y="278" width="12" height="68" rx="3" fill="#1c1e21"/>
  <text x="580" y="370" font-size="12" fill="#4a4f55" text-anchor="middle">self-sealing gasket seats</text>
  <!-- quarter arc arrow -->
  <path d="M668,246 a60,60 0 0 1 44,60" fill="none" stroke="#c82024" stroke-width="5"/>
  <polygon points="712,306 712,288 724,302" fill="#c82024"/>
  <!-- one hand indicator -->
  <circle cx="500" cy="248" r="10" fill="#1c1e21"/>
  <line x1="500" y1="258" x2="500" y2="282" stroke="#1c1e21" stroke-width="5"/>

  <text x="456" y="452" font-size="13.5" fill="#4a4f55">One hand. A quarter turn.</text>
  <text x="456" y="472" font-size="13.5" fill="#4a4f55">The gasket seats and the joint</text>
  <text x="456" y="492" font-size="13.5" fill="#4a4f55">locks. No tool needed.</text>

  <!-- Panel 3: DRY JOINT -->
  <text x="840" y="176" font-size="44" font-weight="bold" fill="#c82024">03</text>
  <text x="840" y="206" font-size="19" font-weight="bold" fill="#1c1e21">DRY JOINT</text>

  <!-- pressurized hose line -->
  <rect x="856" y="300" width="252" height="26" rx="13" fill="#9aa0a6"/>
  <rect x="960" y="290" width="44" height="46" rx="6" fill="#1c1e21"/>
  <!-- water inside -->
  <line x1="870" y1="313" x2="1094" y2="313" stroke="#2563a8" stroke-width="6" stroke-dasharray="14 8"/>
  <!-- no drip: droplet with slash -->
  <path d="M1030,244 C1030,244 1018,262 1018,271 a12,12 0 0 0 24,0 C1042,262 1030,244 1030,244 Z" fill="#2563a8"/>
  <line x1="1012" y1="282" x2="1048" y2="240" stroke="#c82024" stroke-width="5" stroke-linecap="round"/>
  <!-- check -->
  <circle cx="900" cy="250" r="16" fill="#1c1e21"/>
  <polyline points="892,250 898,257 909,243" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="840" y="452" font-size="13.5" fill="#4a4f55">The joint stays dry at 1.6 MPa,</text>
  <text x="840" y="472" font-size="13.5" fill="#4a4f55">clear water or foam, and the</text>
  <text x="840" y="492" font-size="13.5" fill="#4a4f55">line is ready to throw.</text>

  <g font-size="14" fill="#1c1e21">
    <rect x="48" y="580" width="110" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="103" y="603" text-anchor="middle">1.6 MPa</text>

    <rect x="174" y="580" width="224" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="286" y="603" text-anchor="middle">Aluminum (brass / chrome)</text>

    <rect x="414" y="580" width="220" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="524" y="603" text-anchor="middle">65 mm German standard</text>

    <rect x="650" y="580" width="130" height="36" rx="18" fill="#ffffff" stroke="#d5d8dc"/>
    <text x="715" y="603" text-anchor="middle">Water + foam</text>
  </g>

  <text x="48" y="662" font-size="12" fill="#9aa0a6">Schematic, not to scale. All facts per the Storz coupling specification sheet.</text>
</svg>
